name: clinic-stack

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    env_file:
      - ./env/backend.env
    restart: unless-stopped
    expose:
      - "8000"
    networks: [internal]

  dashboard:
    build:
      context: .
      dockerfile: docker/dashboard/Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_LALA_API_URL: ${NEXT_PUBLIC_LALA_API_URL}
    restart: unless-stopped
    expose:
      - "3001"
    networks: [internal]
    depends_on: [backend]

  lumen:
    build:
      context: .
      dockerfile: docker/lumen/Dockerfile
    env_file:
      - ./env/lumen.env
    restart: unless-stopped
    expose:
      - "3000"
    networks: [internal]

  voice-client:
    build:
      context: .
      dockerfile: docker/voice-client/Dockerfile
    environment:
      LALA_API_URL: ${NEXT_PUBLIC_LALA_API_URL}
    restart: unless-stopped
    expose:
      - "80"
    networks: [internal]
    depends_on: [backend]

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
    environment:
      LUMEN_HOST: ${LUMEN_HOST:-lumen.localhost}
      DASHBOARD_HOST: ${DASHBOARD_HOST:-app.localhost}
      VOICE_HOST: ${VOICE_HOST:-voice.localhost}
      API_HOST: ${API_HOST:-api.localhost}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
    restart: unless-stopped
    networks: [internal]
    depends_on:
      - lumen
      - dashboard
      - voice-client
      - backend

networks:
  internal:
    driver: bridge
